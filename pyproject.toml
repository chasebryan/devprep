[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "devprep"
version = "0.1.0"
description = "Prepare a complete development workstation on Linux, macOS, and Windows"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
devprep = "devprep.cli:main"

[tool.setuptools]
packages = ["devprep"]

[tool.setuptools.package-data]
devprep = ["catalog.json"]
