name: Verify devprep

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.14']
        exclude:
          - os: macos-latest
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m devprep --json
      - run: python -m pip install .
      - run: devprep --list
      - if: runner.os != 'Windows'
        run: sh -n install.sh && ./install.sh --dry-run --tools git,python
      - if: runner.os == 'Windows'
        shell: powershell
        run: .\install.ps1 --dry-run --tools git,python

  linux-install-smoke:
    # Real installations only inside disposable containers; never provision the runner host.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:bookworm', 'fedora:latest', 'archlinux:latest', 'alpine:latest', 'opensuse/tumbleweed:latest']
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap Python, install a small selection, then rerun
        env:
          DEVPREP_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/source:ro" "$DEVPREP_IMAGE" sh -c '
            mkdir /tmp/devprep && cp -R /source/. /tmp/devprep/ && cd /tmp/devprep &&
            sh install.sh --tools git,cmake --yes &&
            sh install.sh --tools git,cmake --yes --no-refresh &&
            git --version && cmake --version &&
            python3 -m unittest discover -s tests
          '
